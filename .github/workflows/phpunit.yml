name: CI

on:
  push:
  pull_request:
  # The e2e "latest" stack follows WooCommerce releases, not pushes.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Tests and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The dev tools need PHP 8.2 (fsylum/rector-wordpress); the plugin is
      # checked against PHP 8.1 by the tools' own settings.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # wpify/scoper builds the scoped deps/ (composer-deps.json) on install,
      # which PHPStan reads; same as create-build.yml.
      - run: composer global config --no-plugins allow-plugins.wpify/scoper true
      - run: composer global require wpify/scoper

      - run: composer install --no-interaction --no-progress

      - name: PHPUnit
        run: composer test:unit

      - name: PHPCS
        run: composer lint:phpcs

      - name: PHPStan
        run: composer lint:phpstan

      - name: Rector
        run: composer lint:rector

  e2e:
    name: Block checkout, ${{ matrix.stack }} stack (Playground)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # min: the plugin header's minimums; latest: newest WordPress,
        # WooCommerce and PHP (tests/e2e/stack.js).
        stack: [min, latest]

    steps:
      - uses: actions/checkout@v5

      # The plugin loads deps/ (wpify/scoper) and vendor/ at runtime.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer global config --no-plugins allow-plugins.wpify/scoper true
      - run: composer global require wpify/scoper
      - run: composer install --no-interaction --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Calls ARES and VIES live, like the checkout does.
      - run: npm run test:e2e:${{ matrix.stack }}

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results-${{ matrix.stack }}
          path: test-results
