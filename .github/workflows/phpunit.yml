name: CI

on: [push, pull_request]

jobs:
  test:
    name: Tests and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The dev tools need PHP 8.2 (fsylum/rector-wordpress); the plugin is
      # checked against PHP 8.1 by the tools' own settings.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # wpify/scoper builds the scoped deps/ (composer-deps.json) on install,
      # which PHPStan reads; same as create-build.yml.
      - run: composer global config --no-plugins allow-plugins.wpify/scoper true
      - run: composer global require wpify/scoper

      - run: composer install --no-interaction --no-progress

      - name: PHPUnit
        run: composer test:unit

      - name: PHPCS
        run: composer lint:phpcs

      - name: PHPStan
        run: composer lint:phpstan

      - name: Rector
        run: composer lint:rector
