name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The latest stack follows WordPress, WooCommerce and PHP releases, not pushes.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  # deploy.yml, on a published release: unit tests and both e2e stacks.
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: false

jobs:
  test:
    name: Tests and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The dev tools need PHP 8.2 (fsylum/rector-wordpress); the plugin is
      # checked against PHP 8.1 by the tools' own settings.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: composer install --no-interaction --no-progress

      - name: PHPUnit
        run: composer test:unit

      - name: PHPCS
        run: composer lint:phpcs

      - name: PHPStan
        run: composer lint:phpstan

      - name: Rector
        run: composer lint:rector

  e2e:
    name: Classic and block checkout, ${{ matrix.stack }} stack (Playground)
    # A published release (deploy.yml) and by hand: both stacks; the weekly run: latest.
    if: inputs.e2e || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # min: the plugin header's minimums; latest: newest WordPress,
        # WooCommerce and PHP (tests/e2e/stack.js).
        stack: ${{ fromJSON( github.event_name == 'schedule' && '["latest"]' || '["min","latest"]' ) }}

    steps:
      - uses: actions/checkout@v5

      # The plugin loads vendor/ (its own autoloader) at runtime.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Calls ARES live, like the checkout does; VIES is answered by tests/e2e/mu-plugin.php.
      - run: npm run test:e2e:${{ matrix.stack }}

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results-${{ matrix.stack }}
          path: test-results
