name: Deploy to WordPress.org

# Publishing a GitHub release runs every test (unit, lint, both Playground stacks),
# then deploys its tag to WordPress.org and attaches the zip to the release.
on:
  release:
    types: [published]

jobs:
  tests:
    uses: ./.github/workflows/phpunit.yml
    with:
      e2e: true

  deploy:
    name: New release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      # The plugin's own autoloader, without the dev tools.
      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: woolab-ic-dic

      - name: Attach the zip to the release
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.deploy.outputs.zip-path }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
